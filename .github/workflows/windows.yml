name: Windows 中文版
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-ZH-x64
          path: windows/dist/*.exe
